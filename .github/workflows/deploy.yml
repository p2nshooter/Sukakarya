name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Apply pending D1 migrations before deploying"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-app-desa
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # Fails fast with a readable message instead of letting wrangler emit an
      # opaque auth error halfway through the deploy.
      - name: Check required secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      # First step that actually talks to Cloudflare, so it is where a
      # misscoped token surfaces. Translate the API's opaque 7403 into the two
      # things that actually cause it.
      - name: Apply D1 migrations
        if: github.event_name == 'push' || inputs.run_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 migrations apply app-desa-db --remote; then
            echo "::error::Cloudflare rejected the request. Either CLOUDFLARE_API_TOKEN lacks 'D1: Edit' (plus Workers Scripts, R2 and KV Edit), or CLOUDFLARE_ACCOUNT_ID points at a different account than the one owning app-desa-db. See README > API token permissions."
            exit 1
          fi

      # Both files are idempotent upserts, so re-running on every deploy keeps
      # the module catalogue in step with the code without touching any
      # per-village override.
      - name: Sync module catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute app-desa-db --remote --file=./db/seed/modules.sql

      - name: Build and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      - name: Summary
        run: |
          {
            echo "### Deploy selesai"
            echo ""
            echo "- Worker: \`app-desa\`"
            echo "- D1: \`app-desa-db\` (migrasi diterapkan)"
            echo "- R2: \`app-desa-media\`"
            echo "- KV: \`app-desa-kv\`"
          } >> "$GITHUB_STEP_SUMMARY"
