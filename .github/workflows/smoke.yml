name: Smoke test

# Hits the deployed Worker over real HTTP and asserts on status codes and
# response bodies. "wrangler uploaded it" is not the same as "the site works",
# and the difference has bitten this project before.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        required: false
        default: "https://app-desa.app-desa.workers.dev"
        type: string
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    name: Probe the live Worker
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ inputs.base_url || 'https://app-desa.app-desa.workers.dev' }}

    steps:
      - name: Probe public routes
        run: |
          set -uo pipefail
          failures=0

          {
            echo "### Smoke test"
            echo ""
            echo "Base: \`${BASE}\`"
            echo ""
            echo "| Check | Expected | Got | |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # A Worker that has just been uploaded can take a few seconds before
          # the route resolves, so give the first request room to settle.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE}/" || echo 000)
            [ "$code" != "000" ] && break
            echo "Route not resolving yet (attempt ${attempt}), waiting..."
            sleep 10
          done

          # Every result goes to stdout as well as the summary. A red run whose
          # numbers live only in the summary is a run you have to click into to
          # learn anything from.
          check() {
            label="$1"; path="$2"; want="$3"
            got=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}${path}" || echo 000)
            if [ "$got" = "$want" ]; then mark="✅"; else mark="❌"; failures=$((failures+1)); fi
            echo "${mark} ${label} ${path} - want ${want}, got ${got}"
            echo "| ${label} \`${path}\` | ${want} | ${got} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
            # A 5xx carries the reason in the body; print it once so the cause
            # is in the log instead of requiring a second manual request.
            if [ "$got" != "$want" ] && [ "${got#5}" != "$got" ]; then
              echo "--- body of ${path} (first 40 lines) ---"
              curl -sS --max-time 30 "${BASE}${path}" | head -40 || true
              echo "--- end ---"
            fi
          }

          absent() {
            label="$1"; path="$2"; needle="$3"
            if curl -sS --max-time 30 "${BASE}${path}" | grep -qF "$needle"; then
              mark="❌"; got="STILL PRESENT"; failures=$((failures+1))
            else
              mark="✅"; got="gone"
            fi
            echo "${mark} ${label} - '${needle}' ${got}"
            echo "| ${label} | \`${needle}\` | ${got} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
          }

          contains() {
            label="$1"; path="$2"; needle="$3"
            if curl -sS --max-time 30 "${BASE}${path}" | grep -qF "$needle"; then
              mark="✅"; got="found"
            else
              mark="❌"; got="missing"; failures=$((failures+1))
            fi
            echo "${mark} ${label} - '${needle}' ${got}"
            echo "| ${label} | \`${needle}\` | ${got} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
          }

          check "Homepage"       "/"                200
          check "Admin login"    "/admin/login"     200
          check "Sitemap"        "/sitemap.xml"     200
          check "Robots"         "/robots.txt"      200
          check "Unknown page"   "/tidak-ada-nya"   404
          check "Letter services" "/layanan"        200
          check "Letter tracking" "/layanan/lacak"  200
          check "UMKM"           "/umkm"            200
          check "Tourism"        "/wisata"          200
          check "Potentials"     "/potensi"         200
          check "Transparency"   "/transparansi"    200

          # A service detail page proves the dynamic form engine reached the
          # database, not just that the listing rendered.
          check "Service detail" "/layanan/surat-keterangan-usaha" 200

          # The admin panel must not be reachable without a session. A redirect
          # to the login page is the pass condition; a 200 would mean the gate
          # is open.
          admin=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/admin")
          if [ "$admin" = "307" ] || [ "$admin" = "302" ] || [ "$admin" = "308" ]; then
            mark="✅"
          else
            mark="❌"; failures=$((failures+1))
          fi
          echo "${mark} Admin panel is gated /admin - want 30x, got ${admin}"
          echo "| Admin panel is gated \`/admin\` | 30x | ${admin} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"

          contains "robots.txt disallows /admin" "/robots.txt" "Disallow: /admin"

          # The homepage must be showing real content, not a column of empty
          # states - a deploy that renders but has nothing in it is not a pass.
          contains "Homepage renders letters" "/" "Ajukan"
          contains "Service form is rendered" "/layanan/surat-keterangan-usaha" "applicantName"

          # The identity the site publishes. These guard against a re-seed
          # quietly putting the demonstration tenant back on a live village.
          contains "Village name is Sukakarya"   "/"       "Sukakarya"
          contains "Kepala Desa is named"        "/profil" "Joni Fahamsyah"
          contains "Letter catalogue is usable"  "/layanan" "Ajukan Surat Ini"

          # Placeholder contact details would be acted on by a resident, so
          # their absence is asserted rather than assumed.
          absent   "No placeholder email"        "/" "example.test"
          absent   "No placeholder telephone"    "/" "(021) 0000000"
          absent   "No demo village name"        "/" "Desa Contoh"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" -ne 0 ]; then
            echo "**${failures} check(s) failed.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${failures} smoke check(s) failed against ${BASE}"
            exit 1
          fi
          echo "**All checks passed.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Show what the homepage actually returned
        if: always()
        run: |
          {
            echo ""
            echo "<details><summary>Response headers</summary>"
            echo ""
            echo '```'
            curl -sS -D - -o /dev/null --max-time 30 "${BASE}/" || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
