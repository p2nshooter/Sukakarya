name: Smoke test

# Hits the deployed Worker over real HTTP and asserts on status codes and
# response bodies. "wrangler uploaded it" is not the same as "the site works",
# and the difference has bitten this project before.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        required: false
        default: "https://app-desa.app-desa.workers.dev"
        type: string
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    name: Probe the live Worker
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ inputs.base_url || 'https://app-desa.app-desa.workers.dev' }}

    steps:
      - name: Probe public routes
        run: |
          set -uo pipefail
          failures=0

          {
            echo "### Smoke test"
            echo ""
            echo "Base: \`${BASE}\`"
            echo ""
            echo "| Check | Expected | Got | |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # A Worker that has just been uploaded can take a few seconds before
          # the route resolves, so give the first request room to settle.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE}/" || echo 000)
            [ "$code" != "000" ] && break
            echo "Route not resolving yet (attempt ${attempt}), waiting..."
            sleep 10
          done

          # Every result goes to stdout as well as the summary. A red run whose
          # numbers live only in the summary is a run you have to click into to
          # learn anything from.
          check() {
            label="$1"; path="$2"; want="$3"
            got=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}${path}" || echo 000)
            if [ "$got" = "$want" ]; then mark="✅"; else mark="❌"; failures=$((failures+1)); fi
            echo "${mark} ${label} ${path} - want ${want}, got ${got}"
            echo "| ${label} \`${path}\` | ${want} | ${got} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
            # A 5xx carries the reason in the body; print it once so the cause
            # is in the log instead of requiring a second manual request.
            if [ "$got" != "$want" ] && [ "${got#5}" != "$got" ]; then
              echo "--- body of ${path} (first 40 lines) ---"
              curl -sS --max-time 30 "${BASE}${path}" | head -40 || true
              echo "--- end ---"
            fi
          }

          absent() {
            label="$1"; path="$2"; needle="$3"
            if curl -sS --max-time 30 "${BASE}${path}" | grep -qF "$needle"; then
              mark="❌"; got="STILL PRESENT"; failures=$((failures+1))
            else
              mark="✅"; got="gone"
            fi
            echo "${mark} ${label} - '${needle}' ${got}"
            echo "| ${label} | \`${needle}\` | ${got} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
          }

          contains() {
            label="$1"; path="$2"; needle="$3"
            if curl -sS --max-time 30 "${BASE}${path}" | grep -qF "$needle"; then
              mark="✅"; got="found"
            else
              mark="❌"; got="missing"; failures=$((failures+1))
            fi
            echo "${mark} ${label} - '${needle}' ${got}"
            echo "| ${label} | \`${needle}\` | ${got} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
          }

          check "Homepage"       "/"                200

          # The staff sign-in answers 200 when no knock code is configured and
          # 404 once one is - and 404 is the feature working, not a fault. A
          # flat `check ... 200` here would turn the village switching the knock
          # on into a red run reporting correct behaviour, which is the fastest
          # way to teach somebody to ignore this report.
          login=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/admin/login" || echo 000)
          if [ "$login" = "200" ] || [ "$login" = "404" ]; then
            mark="✅"; note=$([ "$login" = "404" ] && echo "tersembunyi di balik kode ketuk" || echo "terbuka")
          else
            mark="❌"; note="tak terduga"; failures=$((failures+1))
          fi
          echo "${mark} Admin login /admin/login - want 200 atau 404, got ${login} (${note})"
          echo "| Admin login \`/admin/login\` | 200 atau 404 | ${login} ${note} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"

          check "Sitemap"        "/sitemap.xml"     200
          check "Robots"         "/robots.txt"      200
          check "Unknown page"   "/tidak-ada-nya"   404
          check "Letter services" "/layanan"        200
          check "Letter tracking" "/layanan/lacak"  200
          check "UMKM"           "/umkm"            200
          check "Tourism"        "/wisata"          200
          check "Potentials"     "/potensi"         200
          check "Transparency"   "/transparansi"    200

          # A service detail page proves the dynamic form engine reached the
          # database, not just that the listing rendered.
          check "Service detail" "/layanan/surat-keterangan-usaha" 200

          # The admin panel must not be reachable without a session. A redirect
          # to the login page is the pass condition; a 200 would mean the gate
          # is open.
          admin=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/admin")
          if [ "$admin" = "307" ] || [ "$admin" = "302" ] || [ "$admin" = "308" ]; then
            mark="✅"
          else
            mark="❌"; failures=$((failures+1))
          fi
          echo "${mark} Admin panel is gated /admin - want 30x, got ${admin}"
          echo "| Admin panel is gated \`/admin\` | 30x | ${admin} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"

          contains "robots.txt disallows /admin" "/robots.txt" "Disallow: /admin"

          # The homepage must be showing real content, not a column of empty
          # states - a deploy that renders but has nothing in it is not a pass.
          contains "Homepage renders letters" "/" "Ajukan"
          contains "Service form is rendered" "/layanan/surat-keterangan-usaha" "applicantName"

          # The identity the site publishes. These guard against a re-seed
          # quietly putting the demonstration tenant back on a live village.
          contains "Village name is Sukakarya"   "/"       "Sukakarya"
          contains "Kepala Desa is named"        "/profil" "Joni Fahamsyah"
          contains "Letter catalogue is usable"  "/layanan" "Ajukan Surat Ini"

          # Placeholder contact details would be acted on by a resident, so
          # their absence is asserted rather than assumed.
          absent   "No placeholder email"        "/" "example.test"
          absent   "No placeholder telephone"    "/" "(021) 0000000"
          absent   "No demo village name"        "/" "Desa Contoh"

          # Leftovers from automated panel tests.
          #
          # The browser tests that exercise Tata Letak rename a section and add
          # one, using a timestamped title so each run is distinguishable. Run
          # against the deployed site rather than a local one, those titles are
          # written to the real database and then render on the real homepage -
          # a heading reading "Judul uji 1786496072769" above the village's own
          # banner. Nothing removes them afterwards, so the only thing that
          # catches it is an assertion here.
          absent   "No test heading left behind"  "/" "Judul uji"
          absent   "No test section left behind"  "/" "Bagian diubah"

          # Things that are shipped in the repository but only reach the live
          # site through a migration or a deploy step. Each of these has already
          # been "done" once in a way that never actually appeared in
          # production, so the live site is asked directly rather than trusted.
          contains "Regency is published"   "/" "Kabupaten Bekasi"
          contains "Village crest is served" "/" "med_logo_desa"

          # Everything the village office actually put on the site. All of it
          # arrives through db/seed/village-assets.sql, which only the bootstrap
          # workflow runs - so nothing here is guaranteed by a deploy, and the
          # only way to know whether it is still live is to ask the live site.
          # Twice now something was "shipped" that production never received;
          # these turn the third time into a red run instead of a discovery.
          # The resident's own doors. `/masuk` and `/daftar` are the only way
          # into an account, and a letter that requires one used to send people
          # to the staff sign-in - which sits behind the knock code and answers
          # 404. A resident who pressed it reached a page that does not exist.
          check    "Resident sign-in"    "/masuk"  200
          check    "Resident register"   "/daftar" 200
          absent   "No staff login link for residents" "/layanan/surat-keterangan-tidak-mampu" "/admin/login"

          contains "Kepala Desa photo is served" "/" "med_kades_sukakarya"
          contains "Welcome video is served"     "/" "med_sambutan_video"
          contains "Profile video is served"     "/" "med_profil_video"

          # The map point. The Peta Lokasi section renders nothing at all
          # without coordinates, and a pin on a government site is read as an
          # address - so both "is there a map" and "does it point at the office"
          # are worth asking the live site rather than assuming from the repo.
          #
          # This one reports the value it found instead of just "missing". The
          # first version said only that, and a run that tells you to go and
          # look is a run that has not done the job this report exists for: the
          # answer was that the map was there and aimed somewhere else, which
          # took a separate investigation to discover.
          contains "Map section is rendered"  "/" "openstreetmap.org/export/embed"

          want_marker="marker=-6.2419%2C107.1523"
          got_marker=$(curl -sS --max-time 30 "${BASE}/" \
            | grep -o 'marker=[-0-9.]*%2C[-0-9.]*' | head -1)
          if [ "$got_marker" = "$want_marker" ]; then
            mark="✅"
          else
            mark="❌"; failures=$((failures+1))
          fi
          echo "${mark} Map points at the office - want '${want_marker}', got '${got_marker:-tidak ada penanda}'"
          echo "| Map points at the office | \`${want_marker}\` | \`${got_marker:-tidak ada penanda}\` | ${mark} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" -ne 0 ]; then
            echo "**${failures} check(s) failed.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${failures} smoke check(s) failed against ${BASE}"
            exit 1
          fi
          echo "**All checks passed.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Show what the homepage actually returned
        if: always()
        run: |
          {
            echo ""
            echo "<details><summary>Response headers</summary>"
            echo ""
            echo '```'
            curl -sS -D - -o /dev/null --max-time 30 "${BASE}/" || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
