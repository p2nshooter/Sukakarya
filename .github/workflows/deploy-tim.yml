name: Deploy roster app

# The roster app is a separate Worker on a separate database from the village
# CMS, so it gets a separate pipeline. Nothing here touches app-desa, and a
# failure on one side cannot take the other down.

on:
  push:
    branches: [main]
    paths:
      - "apps/tim/**"
      - ".github/workflows/deploy-tim.yml"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Create the D1 database and R2 bucket first (one-off)"
        type: boolean
        default: false
      apply_schema:
        description: "Apply apps/tim/schema.sql before deploying"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-app-tim
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app-tim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: apps/tim/wrangler.jsonc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -p apps/tim/tsconfig.json

      - name: Check required secrets are present
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      # Both are safe to re-run: creating a database or bucket that already
      # exists fails, and that failure is not a reason to stop the deploy.
      - name: Create D1 and R2
        if: inputs.bootstrap
        run: |
          npx wrangler d1 create app-tim-db || echo "app-tim-db already exists"
          npx wrangler r2 bucket create app-tim-archive || echo "app-tim-archive already exists"

      # The database id is looked up by name on every run rather than kept in
      # the committed config. Pasting an id into wrangler.jsonc by hand is the
      # one step in provisioning that nobody can do from the Actions tab, and
      # getting it wrong deploys a Worker bound to nothing.
      - name: Resolve the D1 database id
        run: |
          set -euo pipefail
          id="$(npx wrangler d1 list --json | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const list = JSON.parse(raw);
              const found = list.find((db) => db.name === "app-tim-db");
              if (!found) { console.error("app-tim-db not found"); process.exit(1); }
              process.stdout.write(found.uuid || found.id || found.database_id || "");
            });
          ')"

          if [ -z "$id" ]; then
            echo "::error::Database app-tim-db does not exist. Re-run this workflow with the bootstrap option ticked."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const id = process.argv[2];
            const config = fs.readFileSync(path, "utf8");
            fs.writeFileSync(
              path,
              config.replace(/("database_id"\s*:\s*)"[^"]*"/, `$1"${id}"`),
            );
          ' "$CONFIG" "$id"

          echo "Bound app-tim-db (${id})"

      # The schema is idempotent (CREATE TABLE IF NOT EXISTS throughout), so
      # re-applying it is safe and never drops a row.
      - name: Apply schema
        if: inputs.apply_schema
        run: npx wrangler d1 execute app-tim-db --remote --file=./apps/tim/schema.sql --config "$CONFIG"

      - name: Deploy Worker
        run: npx wrangler deploy --config "$CONFIG"

      - name: Summary
        run: |
          {
            echo "### Roster app deployed"
            echo ""
            echo "- Worker: \`app-tim\` (separate from \`app-desa\`)"
            echo "- D1: \`app-tim-db\`"
            echo "- R2: \`app-tim-archive\` (snapshots and exports)"
            echo ""
            echo "**Next:** run the **Create roster operator** workflow to make the"
            echo "first account, then sign in at \`/masuk\` on the Worker's URL."
          } >> "$GITHUB_STEP_SUMMARY"
