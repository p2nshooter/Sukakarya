name: Bootstrap Cloudflare resources

# One-off provisioning. Creates the D1 database, KV namespace and R2 bucket in
# the account that CLOUDFLARE_API_TOKEN belongs to, then prints the ids so they
# can be written into wrangler.jsonc.
#
# Safe to re-run: each step tolerates "already exists" and reports the existing
# id instead of failing.

on:
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: "Also apply db/seed/seed.sql (roles, permissions, demo tenant). Re-running resets the demo tenant's branding, menus and sections."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create D1, KV and R2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Show which account this token can reach
        run: |
          echo "### Accounts reachable by this token" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler whoami 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create D1 database
        run: |
          echo "## D1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 create app-desa-db 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Existing D1 databases" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 list --json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create KV namespace
        run: |
          echo "## KV" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler kv namespace create KV 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Existing KV namespaces" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler kv namespace list 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create R2 bucket
        run: |
          echo "## R2" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler r2 bucket create app-desa-media 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The deploy applies migrations and the module catalogue, but never this
      # file. Without it the database has a schema and 300 modules and no
      # `villages` row at all, so `requireVillage()` throws and every page 500s.
      #
      # It lives here rather than in the deploy because its upserts would
      # otherwise reset the demo tenant's name, colours, menus and sections on
      # every push, silently undoing an operator's work.
      - name: Apply baseline seed (roles, permissions, demo tenant)
        if: inputs.seed_baseline
        run: |
          echo "## Baseline seed" >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 migrations apply app-desa-db --remote
          npx wrangler d1 execute app-desa-db --remote --file=./db/seed/modules.sql
          npx wrangler d1 execute app-desa-db --remote --file=./db/seed/seed.sql
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 execute app-desa-db --remote --json \
            --command "SELECT (SELECT count(*) FROM villages) AS villages, (SELECT count(*) FROM modules) AS modules, (SELECT count(*) FROM roles) AS roles, (SELECT count(*) FROM page_sections) AS sections" \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
