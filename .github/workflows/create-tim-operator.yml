name: Create roster operator

# Creates a team and its first operator on the roster database, so /masuk is
# usable without anyone running a script on their own machine.
#
# The password never travels through this workflow in the clear and never
# appears in a log:
#
#   - it is read from the TIM_OPERATOR_PASSWORD repository secret, so Actions
#     masks it in every line it could otherwise print
#   - apps/tim/scripts/create-operator.mjs hashes it on the runner
#     (PBKDF2-SHA256, 210k rounds) and emits only the hash and salt
#   - the generated SQL goes to a temp file outside the checkout and is deleted
#     when the job ends, whether it succeeded or not
#
# This repository is public, so the password must never be a workflow_dispatch
# input - dispatch inputs are recorded in the run and are not masked.

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Team name, shown in the app header and on every report"
        required: true
        default: "Tim Pemenangan"
        type: string
      slug:
        description: "Short id for the team (a-z, 0-9 and dashes)"
        required: true
        default: "tim"
        type: string
      email:
        description: "Operator email (used to sign in)"
        required: true
        type: string
      name:
        description: "Display name"
        required: false
        default: "Administrator"
        type: string
      region:
        description: "Region shown under the team name, e.g. Desa Sukakarya"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: create-tim-operator
  cancel-in-progress: false

jobs:
  create:
    name: Create the account
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: apps/tim/wrangler.jsonc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The email and slug are interpolated into a SQL string in the read-back
      # step, so they are checked against a strict pattern rather than trusted.
      - name: Validate inputs
        env:
          EMAIL: ${{ inputs.email }}
          SLUG: ${{ inputs.slug }}
        run: |
          case "$EMAIL" in
            *[!a-zA-Z0-9.@_+-]* | "" | *"'"* )
              echo "::error::Email contains characters outside [a-zA-Z0-9.@_+-]."
              exit 1 ;;
          esac
          case "$SLUG" in
            *[!a-z0-9-]* | "" )
              echo "::error::Slug must be lowercase letters, digits and dashes only."
              exit 1 ;;
          esac

      - name: Check the password secret is set
        env:
          OPERATOR_PASSWORD: ${{ secrets.TIM_OPERATOR_PASSWORD }}
        run: |
          if [ -z "${OPERATOR_PASSWORD}" ]; then
            echo "::error::Repository secret TIM_OPERATOR_PASSWORD is not set. Add it under Settings > Secrets and variables > Actions, then re-run. It must be at least 12 characters."
            exit 1
          fi
          if [ "${#OPERATOR_PASSWORD}" -lt 12 ]; then
            echo "::error::TIM_OPERATOR_PASSWORD is shorter than the 12-character minimum."
            exit 1
          fi

      # Same lookup the deploy uses: the id lives in Cloudflare, not in the
      # committed config, so this workflow works on a fresh clone.
      - name: Resolve the D1 database id
        run: |
          set -euo pipefail
          id="$(npx wrangler d1 list --json | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const found = JSON.parse(raw).find((db) => db.name === "app-tim-db");
              if (!found) { console.error("app-tim-db not found"); process.exit(1); }
              process.stdout.write(found.uuid || found.id || found.database_id || "");
            });
          ')"

          if [ -z "$id" ]; then
            echo "::error::Database app-tim-db does not exist. Run 'Deploy roster app' with the bootstrap option first."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const config = fs.readFileSync(process.argv[1], "utf8");
            fs.writeFileSync(
              process.argv[1],
              config.replace(/("database_id"\s*:\s*)"[^"]*"/, `$1"${process.argv[2]}"`),
            );
          ' "$CONFIG" "$id"

      - name: Hash the password and apply the account
        env:
          OPERATOR_PASSWORD: ${{ secrets.TIM_OPERATOR_PASSWORD }}
          ORG: ${{ inputs.org }}
          SLUG: ${{ inputs.slug }}
          EMAIL: ${{ inputs.email }}
          FULL_NAME: ${{ inputs.name }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          sql="$(mktemp -t operator-XXXXXX.sql)"
          trap 'rm -f "$sql"' EXIT

          node apps/tim/scripts/create-operator.mjs \
            --org "$ORG" --slug "$SLUG" --email "$EMAIL" \
            --name "$FULL_NAME" --region "$REGION" > "$sql"

          npx wrangler d1 execute app-tim-db --remote --file="$sql" --config "$CONFIG"

      - name: Confirm the account exists
        env:
          EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          # Reads back identifying columns only. Never selects password_hash or
          # password_salt, so no credential material can reach the log.
          npx wrangler d1 execute app-tim-db --remote --config "$CONFIG" \
            --command "SELECT email, full_name, role, status FROM users WHERE email = '${EMAIL}'" \
            | tee /tmp/check.txt

          grep -qF "$EMAIL" /tmp/check.txt || {
            echo "::error::The account was not found after applying the SQL."
            exit 1
          }

          {
            echo "### Operator ready"
            echo ""
            echo "Sign in at \`/masuk\` on the \`app-tim\` Worker URL with:"
            echo ""
            echo "- Email: \`${EMAIL}\`"
            echo "- Password: the value stored in the \`TIM_OPERATOR_PASSWORD\` secret"
            echo ""
            echo "The account has the \`admin\` role, so it can reveal full ID"
            echo "numbers and print reports that contain them. Both are audited."
          } >> "$GITHUB_STEP_SUMMARY"
