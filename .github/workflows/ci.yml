name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Verify the module seed matches the catalogue
        run: node scripts/generate-module-seed.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # No Cloudflare credentials are needed here: the build is bindings-free
      # and every route is rendered on demand at runtime.
      - name: Build
        run: npm run build

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs against a local SQLite database created by miniflare, so a broken
      # migration or seed is caught before it can reach the real D1 instance.
      - name: Apply migrations to a throwaway local database
        run: npx wrangler d1 migrations apply app-desa-db --local

      - name: Seed modules and baseline data
        run: |
          npx wrangler d1 execute app-desa-db --local --file=./db/seed/modules.sql
          npx wrangler d1 execute app-desa-db --local --file=./db/seed/seed.sql

      - name: Assert the catalogue landed with all 300 modules
        run: |
          COUNT=$(npx wrangler d1 execute app-desa-db --local \
            --command="SELECT COUNT(*) AS n FROM modules" --json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].results[0].n))")
          echo "modules in database: $COUNT"
          test "$COUNT" -eq 300
