name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Verify the module seed matches the catalogue
        run: node scripts/generate-module-seed.mjs --check

      - name: Typecheck
        run: npm run typecheck

      # Typecheck cannot see inside a query string. `SELECT lr.created_at`
      # satisfies a LetterRow interface that declares created_at, and the
      # mismatch only appears at runtime as a 500 on whichever screen runs it -
      # which is how the letter print page shipped broken.
      - name: Check SQL columns against the migrations
        run: node scripts/check-sql-columns.mjs

      - name: Unit tests
        run: npm test

      # No Cloudflare credentials are needed here: the build is bindings-free
      # and every route is rendered on demand at runtime.
      - name: Build
        run: npm run build

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs against a local SQLite database created by miniflare, so a broken
      # migration or seed is caught before it can reach the real D1 instance.
      - name: Apply migrations to a throwaway local database
        run: npx wrangler d1 migrations apply app-desa-db --local

      - name: Seed modules and baseline data
        run: |
          npx wrangler d1 execute app-desa-db --local --file=./db/seed/modules.sql
          npx wrangler d1 execute app-desa-db --local --file=./db/seed/seed.sql
          # base-content.sql was missing here, so CI exercised three of the five
          # seeded services and never saw the other two - nor the letter wording
          # that lives in this file. A check that runs against half an install
          # reports on half an install.
          npx wrangler d1 execute app-desa-db --local --file=./db/seed/base-content.sql

      # Migrations run before any seed, so a migration that fills a column on
      # rows the seed has not inserted yet quietly does nothing. That is how the
      # five original letters ended up with no wording on a fresh install, while
      # working perfectly on the already-seeded production database. Asserting
      # on the state AFTER seeding is the only thing that sees it.
      - name: Assert every published letter has wording
        run: |
          EMPTY=$(npx wrangler d1 execute app-desa-db --local \
            --command="SELECT COUNT(*) AS n FROM services WHERE status='published' AND (letter_template IS NULL OR letter_template='')" --json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].results[0].n))")
          echo "layanan tanpa naskah surat: $EMPTY"
          if [ "$EMPTY" -ne 0 ]; then
            npx wrangler d1 execute app-desa-db --local \
              --command="SELECT slug FROM services WHERE status='published' AND (letter_template IS NULL OR letter_template='')"
            echo "::error::${EMPTY} layanan terbit tanpa naskah surat. Halaman cetaknya akan kosong pada pemasangan baru."
            exit 1
          fi

      - name: Assert the catalogue landed with all 300 modules
        run: |
          COUNT=$(npx wrangler d1 execute app-desa-db --local \
            --command="SELECT COUNT(*) AS n FROM modules" --json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].results[0].n))")
          echo "modules in database: $COUNT"
          test "$COUNT" -eq 300
